name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Message
        run: echo "GitHub Actions working"

  deploy:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy project files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: ${{ secrets.SERVER_PATH }}

      - name: Build frontend and restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/azureuser/stockv3/Frontend && npm install && npm run build
            pm2 restart stockv3 || pm2 start /home/azureuser/stockv3/runstockv3.sh --name stockv3
